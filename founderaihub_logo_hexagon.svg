<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">

  <!-- Fond noir -->
  <rect width="800" height="800" fill="#0D1117"/>

  <!-- Points décoratifs coin haut-gauche -->
  <g opacity="0.18">
    <circle cx="110" cy="120" r="6" fill="#00E5FF"/>
    <circle cx="145" cy="120" r="6" fill="#00E5FF"/>
    <circle cx="110" cy="155" r="6" fill="#00E5FF"/>
  </g>
  <!-- Points décoratifs coin bas-droit -->
  <g opacity="0.18">
    <circle cx="655" cy="645" r="6" fill="#00E5FF"/>
    <circle cx="690" cy="645" r="6" fill="#00E5FF"/>
    <circle cx="655" cy="680" r="6" fill="#00E5FF"/>
    <circle cx="690" cy="680" r="6" fill="#00E5FF"/>
  </g>

  <!-- Hexagone principal -->
  <polygon points="400,150 615,275 615,525 400,650 185,525 185,275"
           fill="#0D1117" stroke="#00E5FF" stroke-width="10"
           stroke-linejoin="round"/>

  <!-- Hexagone intérieur décoratif -->
  <polygon points="400,210 565,305 565,495 400,590 235,495 235,305"
           fill="none" stroke="#00E5FF" stroke-width="2"
           stroke-linejoin="round" opacity="0.25"/>

  <!-- Lettre F principale -->
  <text x="385" y="500"
        text-anchor="middle"
        font-family="Arial Black, Arial, sans-serif"
        font-weight="900"
        font-size="280"
        fill="white">F</text>

  <!-- Badge AI -->
  <rect x="430" y="270" width="130" height="74" rx="16" fill="#00E5FF"/>
  <text x="495" y="326"
        text-anchor="middle"
        font-family="Arial Black, Arial, sans-serif"
        font-weight="900"
        font-size="48"
        fill="#0D1117">AI</text>

</svg>
