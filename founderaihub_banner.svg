<?xml version="1.0" encoding="UTF-8"?>
<svg width="2560" height="1440" viewBox="0 0 2560 1440" xmlns="http://www.w3.org/2000/svg">

  <!-- Fond noir plein -->
  <rect width="2560" height="1440" fill="#0D1117"/>

  <!-- ════════════════════════════════════════════════
       ZONE SAFE CENTRALE (1546×423) — visible partout
       centrée : x de 507 à 2053, y de 508 à 931
       Tout le contenu important reste dans cette zone.
       ════════════════════════════════════════════════ -->

  <!-- Grille de points décorative gauche -->
  <g opacity="0.12">
    <circle cx="560" cy="560" r="5" fill="#00E5FF"/>
    <circle cx="595" cy="560" r="5" fill="#00E5FF"/>
    <circle cx="630" cy="560" r="5" fill="#00E5FF"/>
    <circle cx="560" cy="595" r="5" fill="#00E5FF"/>
    <circle cx="595" cy="595" r="5" fill="#00E5FF"/>
    <circle cx="630" cy="595" r="5" fill="#00E5FF"/>
    <circle cx="560" cy="630" r="5" fill="#00E5FF"/>
    <circle cx="595" cy="630" r="5" fill="#00E5FF"/>
    <circle cx="630" cy="630" r="5" fill="#00E5FF"/>
  </g>

  <!-- Grille de points décorative droite -->
  <g opacity="0.12">
    <circle cx="1930" cy="820" r="5" fill="#00E5FF"/>
    <circle cx="1965" cy="820" r="5" fill="#00E5FF"/>
    <circle cx="2000" cy="820" r="5" fill="#00E5FF"/>
    <circle cx="1930" cy="855" r="5" fill="#00E5FF"/>
    <circle cx="1965" cy="855" r="5" fill="#00E5FF"/>
    <circle cx="2000" cy="855" r="5" fill="#00E5FF"/>
    <circle cx="1930" cy="890" r="5" fill="#00E5FF"/>
    <circle cx="1965" cy="890" r="5" fill="#00E5FF"/>
    <circle cx="2000" cy="890" r="5" fill="#00E5FF"/>
  </g>

  <!-- Hexagone logo (à gauche du texte) -->
  <polygon points="760,600 850,652 850,756 760,808 670,756 670,652"
           fill="#0D1117" stroke="#00E5FF" stroke-width="6"
           stroke-linejoin="round"/>
  <!-- F dans l'hexagone -->
  <text x="752" y="755"
        text-anchor="middle"
        font-family="Arial Black, Arial, sans-serif"
        font-weight="900"
        font-size="118"
        fill="white">F</text>
  <!-- Badge AI -->
  <rect x="772" y="638" width="56" height="32" rx="7" fill="#00E5FF"/>
  <text x="800" y="662"
        text-anchor="middle"
        font-family="Arial Black, Arial, sans-serif"
        font-weight="900"
        font-size="20"
        fill="#0D1117">AI</text>

  <!-- Nom de la chaîne -->
  <text x="910" y="715"
        font-family="Arial Black, Arial, sans-serif"
        font-weight="900"
        font-size="96"
        fill="white">Founder<tspan fill="#00E5FF">AI</tspan>Hub</text>

  <!-- Ligne cyan séparatrice -->
  <line x1="912" y1="745" x2="1730" y2="745"
        stroke="#00E5FF" stroke-width="3" opacity="0.35"/>

  <!-- Tagline -->
  <text x="912" y="800"
        font-family="Arial, sans-serif"
        font-weight="bold"
        font-size="38"
